name: AI News Daily

on:
  schedule:
    # 每天北京时间 08:00
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-news-daily
  cancel-in-progress: false

jobs:
  ai-news:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 只需要当前版本代码，不需要下载完整 Git 历史
          fetch-depth: 1

      - name: Prepare persistent processed-news history
        shell: bash
        run: |
          set -euo pipefail

          # 历史文件保存在工作区之外，避免每次 checkout 覆盖。
          PERSISTENT_DATA_DIR="/home/github-runner/data/ai-news-wechat"
          PERSISTENT_HISTORY_FILE="$PERSISTENT_DATA_DIR/processed_news.json"
          WORKSPACE_HISTORY_FILE="$GITHUB_WORKSPACE/processed_news.json"

          mkdir -p "$PERSISTENT_DATA_DIR"

          # 仅在持久化文件首次不存在时迁移仓库中的旧历史。
          # 后续运行绝不使用仓库文件覆盖本地最新历史。
          if [ ! -f "$PERSISTENT_HISTORY_FILE" ]; then
            if [ -f "$WORKSPACE_HISTORY_FILE" ] && [ ! -L "$WORKSPACE_HISTORY_FILE" ]; then
              cp "$WORKSPACE_HISTORY_FILE" "$PERSISTENT_HISTORY_FILE"
              echo "已将仓库中的旧 processed_news.json 迁移到 ECS 持久化目录。"
            else
              printf '{"links": []}\n' > "$PERSISTENT_HISTORY_FILE"
              echo "未找到旧历史文件，已初始化空历史。"
            fi
          else
            echo "发现 ECS 上已有持久化历史，保留现有记录。"
          fi

          # 让现有 Python 脚本继续使用原来的相对路径，无需修改
          # news_fetcher.py / wechat_test.py 的历史读写逻辑。
          rm -f "$WORKSPACE_HISTORY_FILE"
          ln -s "$PERSISTENT_HISTORY_FILE" "$WORKSPACE_HISTORY_FILE"

          echo "历史文件链接："
          ls -l "$WORKSPACE_HISTORY_FILE"
          echo "持久化历史文件：$PERSISTENT_HISTORY_FILE"

          python3 - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "processed_news.json")
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              links = data.get("links", [])
          elif isinstance(data, list):
              links = data
          else:
              raise RuntimeError("processed_news.json 格式不是对象或数组")

          print(f"当前持久化已处理链接数量：{len(links)}")
          PY

      - name: Prepare Python dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          import subprocess
          import sys

          packages = {
              "PIL": "Pillow",
              "pygments": "Pygments",
          }

          missing = [
              package
              for module, package in packages.items()
              if importlib.util.find_spec(module) is None
          ]

          if missing:
              print("需要安装的 Python 依赖：", ", ".join(missing))
              subprocess.check_call([
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--user",
                  "--break-system-packages",
                  "--disable-pip-version-check",
                  *missing,
              ])
          else:
              print("Pillow / Pygments 已安装，无需重复安装。")
          PY

      - name: Run AI news filter
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          python3 news_fetcher.py

      - name: Test WeChat API
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: |
          python3 wechat_test.py
