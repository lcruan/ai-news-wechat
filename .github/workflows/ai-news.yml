name: AI News Daily

on:
  schedule:
    # 每天北京时间 08:00
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news-daily
  cancel-in-progress: false

jobs:
  ai-news:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI news filter
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          python3 news_fetcher.py

      - name: Test WeChat API
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: |
          python3 wechat_test.py

      - name: Save processed news history
        run: |
          # ============================================================
          # 强制进入 GitHub Actions 当前仓库目录
          # self-hosted Runner 上不要依赖默认工作目录
          # ============================================================
          cd "$GITHUB_WORKSPACE"

          echo "当前工作目录："
          pwd

          echo "当前仓库目录内容："
          ls -la

          # ============================================================
          # 检查 processed_news.json
          # ============================================================
          if [ ! -f processed_news.json ]; then
            echo "没有找到 processed_news.json，跳过提交。"
            exit 0
          fi

          # ============================================================
          # 检查 Git 仓库是否正常
          # ============================================================
          if [ ! -d .git ]; then
            echo "错误：$GITHUB_WORKSPACE 下没有找到 .git 目录。"
            echo "GitHub Actions checkout 可能没有正确完成。"
            exit 1
          fi

          echo "Git 仓库检查通过。"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ============================================================
          # 先同步远程分支
          # ============================================================
          echo "同步远程分支：${GITHUB_REF_NAME}"

          git fetch origin "${GITHUB_REF_NAME}"

          # ============================================================
          # 检查当前分支
          # ============================================================
          echo "当前 Git 状态："
          git status --short --branch

          # ============================================================
          # 强制添加 processed_news.json
          # 防止 .gitignore 意外忽略它
          # ============================================================
          git add -f processed_news.json

          # ============================================================
          # 判断是否真的有变化
          # ============================================================
          if git diff --cached --quiet -- processed_news.json; then
            echo "processed_news.json 没有新的变化。"
            exit 0
          fi

          echo "准备提交已处理文章记录："
          cat processed_news.json

          # ============================================================
          # 提交
          # ============================================================
          git commit -m "chore: update processed news history"

          # ============================================================
          # 推送当前分支
          # 使用 HEAD 避免 detached HEAD 导致 push 失败
          # ============================================================
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "processed_news.json 已成功提交并推送。"
