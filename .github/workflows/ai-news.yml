name: AI News Daily

on:
  schedule:
    # 每天北京时间 08:00
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news-daily
  cancel-in-progress: false

jobs:
  ai-news:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI news filter
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          python3 news_fetcher.py

      - name: Test WeChat API
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: |
          python3 wechat_test.py

      - name: Save processed news history
        run: |
          # ============================================================
          # self-hosted Runner 上不要依赖当前 shell 的 Git 工作目录
          # 统一使用 git -C "$GITHUB_WORKSPACE"
          # ============================================================

          echo "GITHUB_WORKSPACE："
          echo "$GITHUB_WORKSPACE"

          echo "当前工作目录："
          pwd

          echo "当前仓库目录内容："
          ls -la "$GITHUB_WORKSPACE"

          # ============================================================
          # 检查 processed_news.json
          # ============================================================
          if [ ! -f "$GITHUB_WORKSPACE/processed_news.json" ]; then
            echo "没有找到 processed_news.json，跳过提交。"
            exit 0
          fi

          # ============================================================
          # 检查 .git
          # ============================================================
          if [ ! -d "$GITHUB_WORKSPACE/.git" ]; then
            echo "错误：$GITHUB_WORKSPACE 下没有找到 .git 目录。"
            echo "GitHub Actions checkout 可能没有正确完成。"
            exit 1
          fi

          echo "Git 仓库检查通过。"

          # ============================================================
          # 清除可能影响 Git 判断仓库位置的环境变量
          # ============================================================
          unset GIT_DIR
          unset GIT_WORK_TREE

          # ============================================================
          # 确认 Git 能够识别仓库
          # ============================================================
          echo "Git 仓库根目录："
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel

          # ============================================================
          # 配置 Git 用户
          # ============================================================
          echo "配置 Git 用户："

          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"

          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ============================================================
          # 查看当前分支
          # ============================================================
          echo "当前 Git 分支："

          git -C "$GITHUB_WORKSPACE" branch --show-current

          # ============================================================
          # 同步远程仓库
          #
          # 这里不再指定具体分支，避免 self-hosted Runner
          # 在 detached HEAD / 分支状态下出现额外问题。
          # ============================================================
          echo "同步远程仓库："

          git -C "$GITHUB_WORKSPACE" fetch origin

          # ============================================================
          # 查看 Git 状态
          # ============================================================
          echo "当前 Git 状态："

          git -C "$GITHUB_WORKSPACE" status --short --branch

          # ============================================================
          # 强制添加 processed_news.json
          # 防止 .gitignore 意外忽略
          # ============================================================
          echo "添加 processed_news.json："

          git -C "$GITHUB_WORKSPACE" add -f processed_news.json

          # ============================================================
          # 判断是否真的有变化
          # ============================================================
          if git -C "$GITHUB_WORKSPACE" diff --cached --quiet -- processed_news.json; then
            echo "processed_news.json 没有新的变化。"
            exit 0
          fi

          # ============================================================
          # 提交
          # ============================================================
          echo "准备提交已处理文章记录："

          cat "$GITHUB_WORKSPACE/processed_news.json"

          git -C "$GITHUB_WORKSPACE" commit \
            -m "chore: update processed news history"

          # ============================================================
          # 推送
          #
          # GITHUB_REF_NAME 在 workflow_dispatch 和 schedule 下
          # 都可以获得当前分支名称。
          # ============================================================
          echo "准备推送当前分支：${GITHUB_REF_NAME}"

          git -C "$GITHUB_WORKSPACE" push \
            origin "HEAD:${GITHUB_REF_NAME}"

          echo "processed_news.json 已成功提交并推送。"
