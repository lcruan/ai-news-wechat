name: AI News Daily

on:
  schedule:
    # 每天北京时间 08:00
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  ai-news:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI news filter
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          python3 news_fetcher.py

      - name: Check generated article
        run: |
          echo "========== 检查 article.json =========="
          if [ ! -f article.json ]; then
            echo "错误：article.json 没有生成！"
            exit 1
          fi

          echo "article.json 已成功生成"
          ls -lh article.json
          echo "========================================"

      - name: Submit article to WeChat draft
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: |
          python3 wechat_test.py
