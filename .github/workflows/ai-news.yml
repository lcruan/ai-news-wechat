name: AI News Daily

on:
  schedule:
    # 每天北京时间 08:00
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai-news:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI news filter
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          python3 news_fetcher.py

      - name: Test WeChat API
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: |
          python3 wechat_test.py

      - name: Save processed news history
        run: |
          if [ -f processed_news.json ] && [ -n "$(git status --porcelain -- processed_news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add processed_news.json
            git commit -m "chore: update processed news history"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "没有新的已处理文章记录需要提交。"
          fi
