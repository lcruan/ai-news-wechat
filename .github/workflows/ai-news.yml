name: AI News Daily

on:
  schedule:
    # 每天北京时间 08:00
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch AI News
        run: |
          echo "开始抓取 AI 新闻..."

          curl -L --max-time 20 \
            "https://feeds.arstechnica.com/arstechnica/technology-lab" \
            -o news.xml

          echo "新闻抓取完成！"
          echo "文件大小："
          wc -c news.xml

          echo "前 100 行："
          head -100 news.xml
